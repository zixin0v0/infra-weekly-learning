apiVersion: batch/v1
kind: Job
metadata:
  name: infra-check
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: python:3.12-slim
          command: ["python", "-c", "print(sum([2, 4, 6]))"]
          resources:
            requests:
              cpu: "500m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
